# SHFF Dock — панель управления контейнерами.
#
#   docker compose up -d --build
#
# Больше ничего готовить не нужно: /home/dock панель создаст сама, общую сеть
# тоже, реестр готовых стеков тянется с гитхаба и кэшируется на хосте.

services:
  dock:
    build: .
    image: shff-dock:0.9.2
    container_name: shff-dock
    restart: unless-stopped

    ports:
      - "${DOCK_PANEL_PORT:-7788}:7788"

    volumes:
      # Управление контейнерами хоста: без сокета панель поднимется, но покажет
      # «докер недоступен».
      - /var/run/docker.sock:/var/run/docker.sock

      # Раскладка стеков. Путь одинаков внутри и снаружи — только поэтому
      # bind-монтирования, которые панель пишет в compose-файлы стеков,
      # разрешаются на хосте в те же каталоги.
      - ${DOCK_ROOT:-/home/dock}:${DOCK_ROOT:-/home/dock}

      # Метрики про железо, а не про контейнер. Без этих трёх строк панель
      # покажет память и диски, выделенные докеру, а не то, что стоит в машине.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/rootfs:ro

    environment:
      # mock — выдуманный хост без докера, docker — настоящий демон
      DOCK_DRIVER: ${DOCK_DRIVER:-docker}
      DOCK_ROOT: ${DOCK_ROOT:-/home/dock}
      DOCK_DOCKER_SOCKET: /var/run/docker.sock
      DOCK_NETWORK: ${DOCK_NETWORK:-dock}
      DOCK_ADOPT_FOREIGN: ${DOCK_ADOPT_FOREIGN:-true}
      DOCK_POLL_INTERVAL: ${DOCK_POLL_INTERVAL:-4000}

      # uid:gid, под которым создаются каталоги данных стеков
      DOCK_PUID: ${DOCK_PUID:-1000}
      DOCK_PGID: ${DOCK_PGID:-1000}

      # Реестр готовых стеков. В образе его нет: пусто — берётся реестр SHFF,
      # свой подключается тем же raw-адресом гитхаба.
      DOCK_REGISTRY_URL: ${DOCK_REGISTRY_URL:-}
      DOCK_REGISTRY_TTL: ${DOCK_REGISTRY_TTL:-60}

      LOG_LEVEL: ${LOG_LEVEL:-info}

    networks:
      - dock

# Та же сеть, в которую панель включает поднятые ею стеки: сервисы видят друг
# друга по именам, а reverse proxy видит их все.
networks:
  dock:
    name: ${DOCK_NETWORK:-dock}
