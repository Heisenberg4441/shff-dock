services:
  dock:
    build: .
    image: shff-dock:0.9.2
    container_name: shff-dock
    restart: unless-stopped
    ports:
      - "${DOCK_PANEL_PORT:-7788}:7788"
    volumes:
      # Ядро управляет контейнерами хоста через этот сокет — без него
      # панель поднимется, но покажет «докер недоступен».
      - /var/run/docker.sock:/var/run/docker.sock
      # dock.yml, отметки о бэкапах и сгенерированные compose-файлы
      - ./data:/app/data
      # Корень томов: панель читает заполненность и создаёт здесь каталоги
      - ${DOCK_HOST_VOLUME_ROOT:-/srv}:${DOCK_HOST_VOLUME_ROOT:-/srv}
      # Метрики хоста: uptime, память и место на диске
      - /proc:/proc:ro
    environment:
      # mock — выдуманный хост без докера, docker — настоящий демон
      DOCK_DRIVER: ${DOCK_DRIVER:-docker}
      DOCK_DATA_DIR: /app/data
      DOCK_DOCKER_SOCKET: /var/run/docker.sock
      DOCK_HOST_VOLUME_ROOT: ${DOCK_HOST_VOLUME_ROOT:-/srv}
      DOCK_HOST_ROOT: ${DOCK_HOST_ROOT:-/}
      DOCK_NETWORK: ${DOCK_NETWORK:-dock}
      DOCK_ADOPT_FOREIGN: ${DOCK_ADOPT_FOREIGN:-true}
      DOCK_POLL_INTERVAL: ${DOCK_POLL_INTERVAL:-4000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - dock

networks:
  dock:
    name: ${DOCK_NETWORK:-dock}
